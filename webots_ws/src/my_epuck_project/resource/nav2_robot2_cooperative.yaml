/robot2/bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: robot2/map
    robot_base_frame: robot2/base_link
    odom_topic: /robot2/odom
    bt_loop_duration: 10
    default_server_timeout: 5000
    wait_for_service_timeout: 5000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

/robot2/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    costmap_update_timeout: 0.35
    enable_stamped_cmd_vel: true
    odom_topic: /robot2/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.16
      yaw_goal_tolerance: 0.70
      stateful: false

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.1650
      lookahead_dist: 0.20
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.30
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.026
      approach_velocity_scaling_dist: 0.45
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.35
      max_angular_accel: 0.20
      allow_reversing: false
      use_collision_detection: true
      transform_tolerance: 1.5
      stateful: true

/robot2/planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    costmap_update_timeout: 0.80
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.15
      use_astar: false
      allow_unknown: true

/robot2/behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: robot2/odom
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    global_frame: robot2/map
    robot_base_frame: robot2/base_link
    transform_tolerance: 2.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.55
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.5

    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

/robot2/local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 0.5
      global_frame: robot2/odom
      robot_base_frame: robot2/base_link
      transform_tolerance: 2.0
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02
      footprint: "[[0.15, 0.07], [0.15, -0.07], [0.04, -0.07], [0.04, -0.12], [-0.03, -0.12], [-0.03, -0.07], [-0.03, 0.07], [-0.03, 0.12], [0.04, 0.12], [0.04, 0.07]]"
      footprint_padding: 0.02
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot2/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
          max_obstacle_height: 1.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Robot 2 solo test inflation radius.
        inflation_radius: 0.1400
        cost_scaling_factor: 1.1

/robot2/global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 0.5
      global_frame: robot2/map
      robot_base_frame: robot2/base_link
      transform_tolerance: 2.0
      footprint: "[[0.15, 0.07], [0.15, -0.07], [0.04, -0.07], [0.04, -0.12], [-0.03, -0.12], [-0.03, -0.07], [-0.03, 0.07], [-0.03, 0.12], [0.04, 0.12], [0.04, 0.07]]"
      footprint_padding: 0.02
      resolution: 0.02
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /robot2/map
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot2/scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
          max_obstacle_height: 1.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Robot 2 solo test inflation radius.
        inflation_radius: 0.1400
        cost_scaling_factor: 1.1

/robot2/lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
