explore_node:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: base_link
    costmap_topic: /map
    costmap_updates_topic: /map_updates
    visualize: true

    planner_frequency: 0.3
    progress_timeout: 20.0

    potential_scale: 1.0
    orientation_scale: 0.0
    gain_scale: 2.0

    transform_tolerance: 1.0
    min_frontier_size: 0.005
