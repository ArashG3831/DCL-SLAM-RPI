/robot2/frontier_explorer:
  ros__parameters:
    use_sim_time: false

    # -------- Topics / frames --------
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose

    global_frame: map
    robot_base_frame: base_link

    frontier_marker_topic: /frontier_explorer/frontiers
    selected_frontier_topic: /frontier_explorer/selected_frontier
    optimized_map_topic: /frontier_explorer/optimized_map

    # -------- Runtime --------
    autostart: true
    control_service_enabled: true
    completion_event_enabled: true
    completion_event_topic: /frontier_explorer/exploration_complete

    # -------- Frontier extraction --------
    frontier_map_optimization_enabled: false
    occ_threshold: 95
    min_frontier_size_cells: 8

    # Important for our tiny arena.
    # Package defaults around 0.5 m are too large for this 1.5 m world.
    frontier_candidate_min_goal_distance_m: 0.08
    frontier_selection_min_distance: 0.08
    escape_enabled: true
    frontier_visit_tolerance: 0.18

    # -------- MRTSP ordering --------
    mrtsp_solver: dp
    dp_solver_candidate_limit: 20
    dp_planning_horizon: 8

    sensor_effective_range_m: 1.5
    weight_distance_wd: 0.8
    weight_gain_ws: 2.0

    # Matches the Robot 2 DWB forward cap.  This is used only by the MRTSP
    # start-node ETA lower-bound term; it does not command motor velocity.
    max_linear_speed_vmax: 0.165
    max_angular_speed_wmax: 0.65

    # -------- Preemption / blocked goals --------
    goal_preemption_enabled: false
    goal_skip_on_blocked_goal: false
    goal_preemption_min_interval_s: 10.0

    # Do not use huge values like 0.5 in our tiny arena.
    goal_preemption_complete_if_within_m: 0.0
    goal_preemption_lidar_range_m: 1.5
    goal_preemption_lidar_fov_deg: 360.0
    goal_preemption_lidar_ray_step_deg: 1.0
    goal_preemption_lidar_yaw_offset_deg: 0.0

    post_goal_settle_enabled: true
    post_goal_min_settle: 0.05
    map_processing_rate_hz: 1.0

    return_to_start_on_complete: false
    all_frontiers_suppressed_behavior: stay

    # -------- Failure memory --------
    frontier_suppression_enabled: true
    frontier_suppression_attempt_threshold: 1
    frontier_suppression_base_size_m: 0.08
    frontier_suppression_expansion_size_m: 0.04
    frontier_suppression_timeout_s: 30.0
    frontier_suppression_no_progress_timeout_s: 20.0
    frontier_suppression_progress_epsilon_m: 0.01
    frontier_suppression_startup_grace_period_s: 1.0
    frontier_suppression_max_attempt_records: 128
    frontier_suppression_max_regions: 32

    # -------- QoS --------
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1

    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    frontier_marker_scale: 0.05
