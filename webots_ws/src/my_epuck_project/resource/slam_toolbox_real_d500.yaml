slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping

    resolution: 0.03
    max_laser_range: 4.0
    minimum_time_interval: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 60.0
    # Benchmark-supported compromise: fresh 1 Hz global map with lower CPU
    # than the previous 0.5 s update interval.
    map_update_interval: 1.0

    throttle_scans: 1
    use_scan_matching: true
    do_loop_closing: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.015
    minimum_travel_heading: 0.02

    debug_logging: false

    # Validated conservative local scan-matching configuration.
    correlation_search_space_dimension: 0.12
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.015
    distance_variance_penalty: 0.05
    angle_variance_penalty: 0.05235987755982989
    minimum_distance_penalty: 0.15
    minimum_angle_penalty: 0.70
    coarse_search_angle_offset: 0.05235987755982989
    coarse_angle_resolution: 0.017453292519943295
    fine_search_angle_offset: 0.003490658503988659
    use_response_expansion: false
