bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 5000
    wait_for_service_timeout: 5000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    costmap_update_timeout: 0.35
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.16
      yaw_goal_tolerance: 0.70
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.11
      max_vel_y: 0.0
      max_vel_theta: 0.65

      min_speed_xy: 0.04
      max_speed_xy: 0.11
      min_speed_theta: 0.40

      acc_lim_x: 0.80
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -0.90
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 21

      sim_time: 1.0
      linear_granularity: 0.02
      angular_granularity: 0.025
      transform_tolerance: 1.0

      xy_goal_tolerance: 0.16
      yaw_goal_tolerance: 0.70
      trans_stopped_velocity: 0.04
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      Oscillation.oscillation_reset_dist: 0.10
      Oscillation.oscillation_reset_angle: 0.45

      ObstacleFootprint.scale: 100.0

      BaseObstacle.scale: 8.0

      PathAlign.scale: 6.0
      PathAlign.forward_point_distance: 0.10

      GoalAlign.scale: 6.0
      GoalAlign.forward_point_distance: 0.10

      PathDist.scale: 10.0
      GoalDist.scale: 12.0

      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    costmap_update_timeout: 0.80
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.15
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 2.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.55
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.5

    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 0.5
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 2.0
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02
      footprint: "[[0.20, 0.125], [0.20, -0.125], [-0.07, -0.125], [-0.07, 0.125]]"
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.09
        cost_scaling_factor: 1.1

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 2.0
      footprint: "[[0.20, 0.125], [0.20, -0.125], [-0.07, -0.125], [-0.07, 0.125]]"
      resolution: 0.03
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.09
        cost_scaling_factor: 1.1

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
